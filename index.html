<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>CT Voxelrechner</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef4ff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#07111f,#102b42);padding:env(safe-area-inset-top) 16px 28px}.app{max-width:760px;margin:auto}.hero{padding:28px 4px 14px}h1{margin:0;font-size:34px}p{color:#aac0d4}.card{background:#102034dd;border:1px solid #27445e;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;color:#aac0d4}input{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:1px solid #38566d;background:#071421;color:white;font-size:17px}.result{font-size:28px;font-weight:700;color:#61d6ff}.small{font-size:14px;color:#aac0d4}.formula{font-family:ui-monospace,monospace;color:#bfeaff;background:#071421;padding:12px;border-radius:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head>
<body><main class="app"><div class="hero"><h1>CT Voxelrechner</h1><p>Voxelgrösse aus Scanbreite/FOV und Detektorbreite berechnen.</p></div><section class="card"><div class="grid"><div><label>Scanbreite / FOV (mm)<input id="fov" type="number" step="any" value="100"></label></div><div><label>Pixel / Detektorbreite (px)<input id="px" type="number" step="1" value="2000"></label></div></div></section><section class="card"><div class="small">Voxelgrösse</div><div class="result"><span id="um">50.00</span> µm</div><div><span id="mm">0.05000</span> mm</div></section><section class="card"><div class="formula">Voxel [µm] = FOV [mm] / Pixel × 1000</div><p class="small">Annahme: isotroper Voxel und die angegebene Pixelzahl entspricht der Breite über das verwendete FOV.</p></section></main><script>
function calc(){let f=Number(document.getElementById('fov').value),p=Number(document.getElementById('px').value);let m=p>0?f/p:NaN;document.getElementById('mm').textContent=Number.isFinite(m)?m.toFixed(5):'–';document.getElementById('um').textContent=Number.isFinite(m)?(m*1000).toFixed(2):'–'}document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
