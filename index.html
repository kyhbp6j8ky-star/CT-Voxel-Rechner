<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>RF IND CT Voxelrechner</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef4ff;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#07111f,#102b42);padding:env(safe-area-inset-top) 16px 28px}.app{max-width:760px;margin:auto}.hero{padding:28px 4px 14px}.badge{display:inline-block;background:#61d6ff;color:#07111f;font-weight:800;padding:6px 10px;border-radius:9px;margin-bottom:12px;letter-spacing:.08em}h1{margin:0;font-size:34px}p{color:#aac0d4}.card{background:#102034dd;border:1px solid #27445e;border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 12px 35px #0005}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{font-size:13px;color:#aac0d4}input{width:100%;margin-top:6px;padding:13px;border-radius:12px;border:1px solid #38566d;background:#071421;color:white;font-size:17px}.result{font-size:31px;font-weight:800;color:#61d6ff;margin:5px 0}.small{font-size:14px;color:#aac0d4}.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #203a50}.row:last-child{border:0}.formula{font-family:ui-monospace,monospace;color:#bfeaff;background:#071421;padding:12px;border-radius:12px;line-height:1.7}@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:29px}}</style></head>
<body><main class="app"><div class="hero"><div class="badge">RF IND</div><h1>CT Voxelrechner</h1><p>Maximale Voxelgrösse aus Toleranz und dünnster Wandstärke.</p></div>
<section class="card"><div class="grid"><div><label>Toleranz [mm]<input id="tol" type="text" inputmode="decimal" autocomplete="off"></label></div><div><label>Dünnste Wandstärke [mm]<input id="wall" type="text" inputmode="decimal" autocomplete="off"></label></div></div></section>
<section class="card"><div class="small">MAX. VOXELGRÖSSE</div><div class="result"><span id="max">–</span> µm</div><div id="reason" class="small">Werte eingeben</div></section>
<section class="card"><div class="row"><span>Aus Toleranz</span><strong><span id="tolOut">–</span> µm</strong></div><div class="row"><span>Aus Wandstärke</span><strong><span id="wallOut">–</span> µm</strong></div></section>
<section class="card"><div class="formula">Toleranz × 0,5<br>Dünnste Wandstärke × 0,2<br>Max. Voxelgrösse = kleinerer Wert</div></section>
</main><script>
const n=v=>{v=(v||'').trim().replace(',','.'); const x=Number(v); return v!==''&&Number.isFinite(x)&&x>=0?x:null};
const fmt=x=>{if(x===null||!Number.isFinite(x)) return '–'; return (x*1000).toLocaleString('de-CH',{maximumFractionDigits:2});};
function calc(){const t=n(document.getElementById('tol').value),w=n(document.getElementById('wall').value);const tv=t===null?null:t*.5,wv=w===null?null:w*.2;tolOut.textContent=fmt(tv);wallOut.textContent=fmt(wv);if(tv===null||wv===null){max.textContent='–';reason.textContent='Beide Werte eingeben';return}const m=Math.min(tv,wv);max.textContent=fmt(m);reason.textContent=tv<wv?'Massgebend: Toleranz':wv<tv?'Massgebend: Wandstärke':'Massgebend: beide Werte';}
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',calc));calc();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
